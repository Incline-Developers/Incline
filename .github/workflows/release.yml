name: Release

# A merge of staging into main is just a push to main, so that is the trigger.
# Only the FIRST push under a given Cargo.toml version builds and releases;
# later pushes at the same version stop after the version check. Bump the
# version in Cargo.toml to ship again — a released version is never rebuilt in
# place, so a published tag always refers to exactly the bytes that shipped
# under it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create the tag and the release

# Never cancel in flight: a superseded run could already be creating the tag
# and the release, and killing it would leave that half done.
concurrency:
  group: release-main
  cancel-in-progress: false

# Tool versions are pinned in source control rather than resolved at build
# time, so a release build is reproducible from the tagged commit alone.
env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Read version
    # workflow_dispatch can be started from any branch; releases only ever come
    # from main, so refuse anything else up front.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, so we can tell whether this version shipped already

      - id: read
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk -F' *= *' '
            /^\[package\]/ { in_pkg = 1; next }
            /^\[/          { in_pkg = 0 }
            in_pkg && $1 == "version" { gsub(/"/, "", $2); print $2; exit }
          ' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::no version found in the [package] table of Cargo.toml"
            exit 1
          fi
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag has already shipped — nothing to do. Bump the version in Cargo.toml to release again."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::First push under $tag — building and releasing."
          fi

  build:
    name: Build linux-x86_64
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang mold libgtk-3-dev libxkbcommon-dev

      # rust-toolchain.toml pins nightly and lists the components (rust-src for
      # build-std) and targets; `rustup show` is what makes rustup honour it.
      - name: Install the pinned toolchain
        run: rustup show

      # No build cache anywhere in this workflow: a release is built clean from
      # the tagged commit, never from state carried over from an earlier build.
      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          name="Incline-Design-${{ needs.version.outputs.version }}-linux-x86_64"
          cp target/release/incline-design "target/release/$name"
          tar -czf "out/$name.tar.gz" -C target/release "$name"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-x86_64
          path: out/*
          if-no-files-found: error

  windows:
    name: Build windows-x86_64
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        run: rustup show

      - name: Build
        run: cargo build --release --locked

      # The binary ships unsigned: Windows will show a SmartScreen warning on
      # first run until the project has a code signing certificate.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out staged
          name="Incline-Design-${{ needs.version.outputs.version }}-windows-x86_64"
          cp target/release/incline-design.exe "staged/$name.exe"
          7z a "out/$name.zip" "./staged/$name.exe"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-x86_64
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build, windows]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The tag does not exist — the version job would have stopped the run
          # otherwise — so this creates it at the commit that was built.
          gh release create "${{ needs.version.outputs.tag }}" artifacts/* \
            --target "$GITHUB_SHA" \
            --title "Incline Design ${{ needs.version.outputs.version }}" \
            --generate-notes
